# Display
#CONFIG_ZMK_DISPLAY=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Deep sleep after 15 min of inactivity. It was turned off May-Oct 2026 because
# the right half never rejoined after waking; the real cause was building for the
# generic nice_nano board (no settings storage, so bonds were lost on every
# reboot/wake). Fixed by building for nice_nano//zmk.
CONFIG_ZMK_SLEEP=y
# TEST: 1 min; set back to 900000 before merging.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000

# Left off since May 2026 (a guess at the same wake bug); can be re-enabled.
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Logging: use the zmk-usb-logging snippet on the left half in build.yaml.

# Save config to flash more frequently
# Default is 60s and this lowers it to 10
# Only use this setting for debugging.
# Prolonged use can lead to flash chip degradation
# CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE 10000
